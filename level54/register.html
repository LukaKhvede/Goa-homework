<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineWorld - Register</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- HEADER -->

    <header>

        <a href="index.html" class="logo">
            CINEWORLD
        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="movies.html">
                Movies
            </a>

            <a href="tickets.html">
                Buy Ticket
            </a>

            <a href="register.html">
                Register
            </a>

        </nav>

    </header>


    <!-- REGISTER -->

    <main class="form-page">

        <div class="form-box">

            <p class="yellow-text">
                JOIN CINEWORLD
            </p>

            <h1>
                Create Account
            </h1>

            <p>
                Create your account and start exploring movies.
            </p>


            <form>

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    placeholder="Enter your name"
                    required
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    placeholder="Create a password"
                    required
                >


                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    placeholder="Confirm your password"
                    required
                >


                <button type="submit">
                    Create Account
                </button>

            </form>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        <h3>CINEWORLD</h3>

        <p>
            © 2026 CineWorld
        </p>

    </footer>


</body>

</html>
