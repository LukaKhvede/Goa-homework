<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineWorld - Buy Ticket</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- HEADER -->

    <header>

        <a href="index.html" class="logo">
            CINEWORLD
        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="movies.html">
                Movies
            </a>

            <a href="tickets.html">
                Buy Ticket
            </a>

            <a href="register.html">
                Register
            </a>

        </nav>

    </header>


    <!-- TICKET PAGE -->

    <main class="form-page">

        <div class="form-box">

            <p class="yellow-text">
                CINEMA
            </p>

            <h1>
                Buy Your Ticket
            </h1>

            <p>
                Choose a movie and reserve your seat.
            </p>


            <form>


                <label>
                    Choose Movie
                </label>

                <select>

                    <option>
                        Dune: Part Two
                    </option>

                    <option>
                        Oppenheimer
                    </option>

                    <option>
                        The Dark Knight
                    </option>

                    <option>
                        Interstellar
                    </option>

                    <option>
                        Inception
                    </option>

                </select>


                <label>
                    Date
                </label>

                <input
                    type="date"
                >


                <label>
                    Time
                </label>

                <select>

                    <option>
                        14:00
                    </option>

                    <option>
                        17:00
                    </option>

                    <option>
                        20:00
                    </option>

                    <option>
                        22:30
                    </option>

                </select>


                <label>
                    Number of Tickets
                </label>

                <select>

                    <option>
                        1 Ticket
                    </option>

                    <option>
                        2 Tickets
                    </option>

                    <option>
                        3 Tickets
                    </option>

                    <option>
                        4 Tickets
                    </option>

                </select>


                <label>
                    Your Email
                </label>

                <input
                    type="email"
                    placeholder="example@gmail.com"
                >


                <button type="submit">
                    Buy Ticket
                </button>

            </form>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        <h3>CINEWORLD</h3>

        <p>
            © 2026 CineWorld
        </p>

    </footer>


</body>

</html>
