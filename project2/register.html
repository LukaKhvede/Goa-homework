<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Registration</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <h1>Formula 1 Registration</h1>
    </header>

    <!-- Main Form Section -->
    <main class="main">

        <div class="form-container">

            <form>

                <h2 class="form-title">Create Your F1 Account</h2>

                <!-- Full Name -->
                <div class="form-group">
                    <label class="form-label">Full Name:</label>
                    <input type="text" class="form-input" placeholder="Enter your full name" required>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label class="form-label">Email:</label>
                    <input type="email" class="form-input" placeholder="Enter your email" required>
                </div>

                <!-- Username -->
                <div class="form-group">
                    <label class="form-label">Username:</label>
                    <input type="text" class="form-input" placeholder="Choose a username" required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label class="form-label">Password:</label>
                    <input type="password" class="form-input" placeholder="Create password" required>
                </div>

                <!-- Favorite Team -->
                <div class="form-group">
                    <label class="form-label">Favorite Team:</label>

                    <select class="form-input" required>
                        <option value="">Choose Team:</option>
                        <option>Ferrari</option>
                        <option>Mercedes</option>
                        <option>Red Bull Racing</option>
                        <option>McLaren</option>
                        <option>Aston Martin</option>
                        <option>Williams</option>
                        <option>Alpine</option>
                        <option>Kick Sauber</option>
                        <option>RB</option>
                        <option>Haas</option>
                    </select>
                </div>

                <!-- Favorite Driver -->
                <div class="form-group">
                    <label class="form-label">Favorite Driver:</label>

                    <select class="form-input">
                        <option value="">Choose Driver:</option>
                        <option>Max Verstappen</option>
                        <option>Lewis Hamilton</option>
                        <option>Charles Leclerc</option>
                        <option>Lando Norris</option>
                        <option>George Russell</option>
                        <option>Fernando Alonso</option>
                        <option>Oscar Piastri</option>
                        <option>Carlos Sainz</option>
                    </select>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="form-btn">
                    Register Now
                </button>

            </form>

        </div>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>Formula 1 &copy; 2026</p>
        <a href="https://www.instagram.com/f1?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==">F1 instagram</a>
    </footer>

</body>
</html>
